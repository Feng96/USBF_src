name: Real frozen-model release validation
on: [workflow_dispatch]
jobs:
  real-example:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements/cpu-linux-py311.lock
      - run: python -m pip install --no-deps .
      - run: python -m pip check
      - run: python -m pytest -q
      - run: |
          mkdir -p outputs
          git rev-parse HEAD > outputs/COMMIT.txt
          python -m pip freeze > outputs/ENVIRONMENT.txt
          usbf doctor > outputs/DOCTOR.json
      - run: usbf fetch --full-inputs --data-dir data
      - run: usbf fetch --offline --full-inputs --data-dir data
      - run: usbf example --data-dir data --output outputs/real --device cpu
      - run: usbf regression --data-dir data --product outputs/real/USBF.parquet --output outputs/regression.json
      - run: usbf evaluate --data-dir data --output outputs/paper
      - run: usbf register --data-dir data --output outputs/registration.json
      - run: usbf example --data-dir data --output outputs/missing-height --device cpu --simulate-missing-height
      - run: python scripts/run_notebook.py notebooks/USBF_local_example.ipynb --output outputs/executed.ipynb
      - run: cp data/DOWNLOAD.json outputs/DOWNLOAD.json
      - uses: actions/upload-artifact@v4
        with:
          name: actual-release-validation
          path: outputs/
