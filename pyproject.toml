[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usbf-reproducible"
version = "0.1.1"
description = "Local reproduction of the USBF manuscript footprint-generation and evaluation methods"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch==2.5.1", "torchvision==0.20.1", "numpy==2.2.5", "scipy==1.15.3",
  "rasterio==1.4.3", "pyproj==3.7.1", "shapely==2.1.1", "geopandas==1.1.1",
  "pyogrio==0.11.0", "pandas==2.2.3", "pyarrow==19.0.1",
  "scikit-image==0.25.2", "opencv-python-headless==4.11.0.86", "matplotlib==3.10.3"
]

[project.optional-dependencies]
test = ["pytest==8.3.5", "nbclient==0.10.2", "nbformat==5.10.4", "ipykernel==6.29.5"]

[project.scripts]
usbf = "usbf.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "licenses/*.txt", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
usbf = ["assets.json"]
